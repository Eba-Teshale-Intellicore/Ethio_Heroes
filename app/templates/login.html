<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Heroes - Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/ethio_heroes.png') }}">
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="light-theme">
    <!-- Theme Toggle -->
    <div class="theme-controls">
        <button id="mode-btn" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Header Section -->
            <header class="auth-header">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='images/ethio_heroes.png') }}" alt="Ethio Heroes Logo">
                </div>
                <h2>Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your account</p>
            </header>
            
            <!-- Login Form -->
            <form action="/login" method="POST" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email_address" placeholder="Email Address" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="password-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- <div class="form-extras">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div> -->

                <button type="submit" class="btn-primary">Login to Account</button>
            </form>

            <div class="divider">
                <span>Or continue with</span>
            </div>

            <!-- Social Logins -->
            <div class="social-grid">
                <a href="/login/google" class="btn-social google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.png" alt="Google">
                    Google
                </a>
                <a href="/login/github" class="btn-social github">
                    <i class="fab fa-github"></i>
                    GitHub
                </a>
            </div>

            <footer class="auth-footer">
                <p>New hero? <a href="/signup">Create account</a></p>
            </footer>
        </div>
    </main>

    <script>
        // Theme Toggle Persistence
        const btn = document.getElementById('mode-btn');
        const body = document.body;

        const setDarkMode = (isDark) => {
            if (isDark) {
                body.classList.add('dark-theme');
                btn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                body.classList.remove('dark-theme');
                btn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        };

        btn.onclick = () => {
            const isDark = !body.classList.contains('dark-theme');
            setDarkMode(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        // Load saved theme
        if (localStorage.getItem('theme') === 'dark') setDarkMode(true);

        // Password Visibility Toggle
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        toggleBtn.onclick = () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        };
    </script>
</body>
</html>
